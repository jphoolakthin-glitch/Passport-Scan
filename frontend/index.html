<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passport Scanner Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.dispatchEvent(new Event('gis-loaded'))"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <h1>Passport Scanner<br>Management System</h1>
      <p class="muted">ระบบจัดการ PC / Scanner / Server ของโรงแรม</p>
      <p id="login-msg" class="error" hidden></p>
      <div id="signin"></div>
    </div>
  </div>

  <div id="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#/dashboard">PSMS</a>
      <nav id="nav"></nav>
      <div class="me"><span id="me-email"></span><button id="signout" class="btn ghost small">ออกจากระบบ</button></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
